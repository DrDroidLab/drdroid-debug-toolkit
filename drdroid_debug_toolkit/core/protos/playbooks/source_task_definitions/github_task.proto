syntax = "proto3";
package core.protos.playbooks;

import "google/protobuf/wrappers.proto";

message Github {
  message FetchRelatedCommits {
    google.protobuf.StringValue owner = 1;
    google.protobuf.StringValue repo = 2;
    google.protobuf.StringValue file_path = 3;
    google.protobuf.StringValue function_name = 4;
    google.protobuf.StringValue branch = 5;
  }

  message FetchFile {
    google.protobuf.StringValue owner = 1;
    google.protobuf.StringValue repo = 2;
    google.protobuf.StringValue file_path = 3;
    sfixed64 timestamp = 4; // getting this timestamp from sentry(or other services), will use it fetch file version from that timestamp
  }

  message UpdateFile {
    google.protobuf.StringValue owner = 1;
    google.protobuf.StringValue repo = 2;
    google.protobuf.StringValue file_path = 3;
    google.protobuf.StringValue committer_name = 4;
    google.protobuf.StringValue committer_email = 5;
    google.protobuf.StringValue content = 6;
    google.protobuf.StringValue message = 7;
    google.protobuf.StringValue sha = 8;
    google.protobuf.StringValue branch = 9;
  }

  message FetchRecentCommits {
    google.protobuf.StringValue owner = 1;
    google.protobuf.StringValue repo = 2;
    google.protobuf.StringValue branch = 3;
    google.protobuf.StringValue author = 4;
  }

  message FetchRecentMerges {
    google.protobuf.StringValue owner = 1;
    google.protobuf.StringValue repo = 2;
    google.protobuf.StringValue branch = 3;
  }

  message FileUpdate {
    google.protobuf.StringValue path = 1;
    google.protobuf.StringValue content = 2;
  }

  message CreatePullRequest {
    google.protobuf.StringValue repo = 1;
    google.protobuf.StringValue title = 2;
    google.protobuf.StringValue body = 3;
    google.protobuf.StringValue head_branch = 4;
    google.protobuf.StringValue base_branch = 5;
    repeated FileUpdate files = 6;
    google.protobuf.StringValue commit_message = 7;
    google.protobuf.StringValue committer_name = 8;
    google.protobuf.StringValue committer_email = 9;
  }

  message CreateProjectDraftIssue {
    google.protobuf.UInt64Value project_number = 1;
    google.protobuf.StringValue title = 2;
    google.protobuf.StringValue body = 3;
  }

  message FetchOrgProjects {
    // Uses connector org; optional override for testing.
    google.protobuf.StringValue org = 1;
  }

  message FetchProject {
    google.protobuf.UInt64Value project_number = 1;
    google.protobuf.StringValue org = 2;
  }

  message FetchProjectItems {
    google.protobuf.UInt64Value project_number = 1;
    google.protobuf.StringValue org = 2;
    google.protobuf.UInt64Value per_page = 3;
  }

  // Create a real repo Issue as a sub-issue of a parent Issue, then add it to the project.
  message CreateProjectSubIssue {
    google.protobuf.UInt64Value project_number = 1;
    google.protobuf.StringValue title = 2;
    google.protobuf.StringValue body = 3;
    // Parent issue repository as "owner/repo" (preferred) or repo name under connector org.
    google.protobuf.StringValue parent_repo = 4;
    google.protobuf.UInt64Value parent_issue_number = 5;
    // Numeric GitHub issue id of the parent (optional; looked up if omitted).
    google.protobuf.UInt64Value parent_issue_id = 6;
  }

  enum TaskType {
    UNKNOWN = 0;
    FETCH_RELATED_COMMITS = 1;
    FETCH_FILE = 2;
    UPDATE_FILE = 3;
    FETCH_RECENT_COMMITS = 4;
    FETCH_RECENT_MERGES = 5;
    CREATE_PULL_REQUEST = 6;
    ANALYZE_SENTRY_CREATE_PR =7;
    CREATE_PROJECT_DRAFT_ISSUE = 8;
    FETCH_ORG_PROJECTS = 9;
    FETCH_PROJECT = 10;
    FETCH_PROJECT_ITEMS = 11;
    CREATE_PROJECT_SUB_ISSUE = 12;
  }

  TaskType type = 1;
  oneof task {
    FetchRelatedCommits fetch_related_commits = 2;
    FetchFile fetch_file = 3;
    UpdateFile update_file = 4;
    FetchRecentCommits fetch_recent_commits = 5;
    FetchRecentMerges fetch_recent_merges = 6;
    CreatePullRequest create_pull_request = 7;
    CreateProjectDraftIssue create_project_draft_issue = 8;
    FetchOrgProjects fetch_org_projects = 9;
    FetchProject fetch_project = 10;
    FetchProjectItems fetch_project_items = 11;
    CreateProjectSubIssue create_project_sub_issue = 12;
  }
}